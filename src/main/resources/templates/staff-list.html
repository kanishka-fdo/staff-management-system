<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h3>Staff</h3>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Department</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${staffList}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.phone}"></td>
            <td th:text="${s.role}"></td>
            <td th:text="${s.department != null ? s.department.name : '—'}"></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/'/'}" class="btn btn-secondary">Back</a>
</div>
</body>
</html>
