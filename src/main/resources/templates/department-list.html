<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Departments</h2>

<table class="table table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Staff Members</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dept : ${departments}">
        <td th:text="${dept.departmentId}">1</td>
        <td th:text="${dept.departmentName}">IT</td>
        <td th:text="${dept.departmentDescription}">Information Technology</td>
        <td>
            <ul th:if="${dept.staffMembers != null and !dept.staffMembers.isEmpty()}">
                <li th:each="s : ${dept.staffMembers}" th:text="${s.name}">John Doe</li>
            </ul>
            <span th:if="${dept.staffMembers == null or dept.staffMembers.isEmpty()}" class="text-muted">No staff assigned</span>
        </td>
    </tr>

    <!-- Handle case when there are no departments -->
    <tr th:if="${#lists.isEmpty(departments)}">
        <td colspan="4" class="text-center text-muted py-3">No departments available.</td>
    </tr>
    </tbody>
</table>

<a href="/" class="btn btn-secondary">Back</a>
</body>
</html>
