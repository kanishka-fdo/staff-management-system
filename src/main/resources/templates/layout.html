<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Department & Staff Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Department & Staff Management</h2>

    <!-- ✅ Create Department -->
    <div class="card mb-4">
        <div class="card-header">Create Department</div>
        <div class="card-body">
            <form th:action="@{/departments/create}" method="post">
                <div class="mb-3">
                    <label class="form-label">Department Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter Department Name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Department Description</label>
                    <input type="text" name="description" class="form-control" placeholder="Enter Department Description">
                </div>
                <button type="submit" class="btn btn-primary">Create Department</button>
            </form>
        </div>
    </div>

    <!-- ✅ Assign Staff -->
    <div class="card mb-4">
        <div class="card-header">Assign Staff to Department</div>
        <div class="card-body">
            <form th:action="@{/departments/assign}" method="post">
                <div class="mb-3">
                    <label class="form-label">Department ID</label>
                    <input type="number" name="departmentId" class="form-control" placeholder="Enter Department ID" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Staff ID</label>
                    <input type="number" name="staffId" class="form-control" placeholder="Enter Staff ID" required>
                </div>
                <button type="submit" class="btn btn-success">Assign Staff</button>
            </form>
        </div>
    </div>

    <!-- ✅ Links to staff and department lists -->
    <div class="d-flex justify-content-between mb-4">
        <a th:href="@{/staff/list}" class="btn btn-info">Show Staff Details</a>
        <a th:href="@{/departments/list}" class="btn btn-warning">Show Department Details</a>
    </div>

    <!-- ✅ Quick View of Departments -->
    <div class="card">
        <div class="card-header">Department List (Quick View)</div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th style="width:120px;">ID</th>
                    <th style="width:240px;">Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- ✅ Loop through departments -->
                <tr th:each="dept : ${departments}">
                    <td th:text="${dept.departmentId}">1</td>
                    <td th:text="${dept.departmentName}">IT</td>
                    <td th:text="${dept.departmentDescription}">Information Technology</td>
                    <td>
                        <a th:href="@{'/departments/' + ${dept.departmentId}}" class="btn btn-sm btn-outline-primary">View</a>
                    </td>
                </tr>

                <!-- ✅ Show message if no departments exist -->
                <tr th:if="${#lists.isEmpty(departments)}">
                    <td colspan="4" class="text-center text-muted py-3">
                        No departments available.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
